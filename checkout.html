<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>合规结算中心</title>
    <style>
        body { font-family: sans-serif; background-color: #0b0b0c; color: #f3f4f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .box { background: #151518; padding: 30px; border-radius: 16px; width: 100%; max-width: 380px; border: 1px solid #2d2d34; text-align: center; }
        .price { font-size: 26px; font-weight: bold; color: #ef4444; margin: 15px 0; }
        .form-row { margin-bottom: 15px; text-align: left; }
        label { display: block; margin-bottom: 6px; color: #9ca3af; font-size: 13px; }
        input, select { width: 100%; padding: 10px; border: 1px solid #2d2d34; background: #0b0b0c; color: #fff; border-radius: 6px; box-sizing: border-box; }
        .btn { background-color: #10b981; color: white; border: none; padding: 12px; width: 100%; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn:hover { background-color: #059669; }
        #msg { color: #38bdf8; font-size: 13px; margin-top: 10px; }
    </style>
</head>
<body>
<div class="box">
    <h3 id="title">确认您的订单</h3>
    <div class="price" id="display-price">0.00 USD</div>
    <p style="color:#9ca3af; font-size:12px; margin-bottom:20px;">（合规商业流：本系统不触碰且不录入任何银行卡明文隐私）</p>
    
    <form id="pay-form">
        <div class="form-row">
            <label>买家备注名称</label>
            <input type="text" id="buyer-name" placeholder="例如：张三" required>
        </div>
        <div class="form-row">
            <label>选择支付渠道方式</label>
            <select id="pay-method">
                <option value="gateway_card">💳 模拟第三方合规收银台（Token代币化）</option>
                <option value="gateway_crypto">🪙 模拟链上安全分布式结算</option>
            </select>
        </div>
        <div id="msg"></div>
        <button type="submit" class="btn" id="sub-btn">安全提交订单</button>
    </form>
</div>
<script>
    const params = new URLSearchParams(window.location.search);
    const seller = params.get('seller') || "自营商户";
    const price = params.get('price') || "0.00";
    const lang = params.get('lang') || "CN";

    document.getElementById('title').textContent = `向 ${seller} 提交订购`;
    document.getElementById('display-price').textContent = `${price} USD`;

    document.getElementById('pay-form').addEventListener('submit', async function(e) {
        e.preventDefault();
        const subBtn = document.getElementById('sub-btn');
        const msgBox = document.getElementById('msg');
        subBtn.disabled = true;
        msgBox.textContent = "边缘计算云端正在建立分布式备案...";

        try {
            // 向云端后端的 /api/save 接口发起合规提单网络同步
            const res = await fetch('/api/save', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    name: document.getElementById('buyer-name').value,
                    method: document.getElementById('pay-method').value,
                    seller: seller,
                    price: price,
                    lang: lang
                })
            });
            const result = await res.json();
            if (result.success) {
                alert("🎉 订单云端安全存入成功！即将返回市场主页。");
                location.href = "/index.html";
            } else {
                alert("❌ 存入失败：" + result.message);
                subBtn.disabled = false;
            }
        } catch (err) {
            msgBox.textContent = "网络故障：" + err.message;
            subBtn.disabled = false;
        }
    });
</script>
</body>
</html>
